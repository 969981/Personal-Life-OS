name: CI (public samples only)

on:
  push:
    branches: [main, feat/personal-life-os-foundation, feat/capture-ai-memos-photos-private-deploy, feat/diary-timeline-wikilinks-ai-mobile]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIFE_OS_SHOW_PRIVATE: "false"
      LIFE_OS_PRIVATE_BUILD: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify no tracked private vault folders
        run: |
          if git ls-files vault | grep -E '^vault/(00-Inbox|Diary|Moments|Ideas|Knowledge|Projects|Life|Reviews|Chat-Captures|Attachments)/'; then
            echo "ERROR: private vault folder has tracked files"
            exit 1
          fi
      - name: Test local capture command
        run: npm test
      - name: Test WikiLink indexes and Diary Timeline parsing
        run: npm run test:knowledge
      - name: Create private canary (must be filtered from public output)
        run: |
          cat > vault/Samples/ci-private-canary.md <<'EOF'
          ---
          title: "CI PRIVATE CANARY"
          type: diary
          date: "2026-11-13"
          visibility: private
          ---
          SECRET_PRIVATE_CONTENT_MUST_NOT_APPEAR
          EOF
      - name: Install
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Test photo importer (EXIF and publishing allowlist)
        run: npm run test:photos
      - name: Build public-only website
        run: npm run build
      - name: Verify generated site
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/diary/index.html
          test -f apps/web/dist/calendar/index.html
          test -f apps/web/dist/search/index.html
          test -f apps/web/dist/capture/index.html
          test -f apps/web/dist/moments/index.html
          test -f apps/web/dist/wiki/samples/knowledge-demo/index.html
          if grep -R -q 'SECRET_PRIVATE_CONTENT_MUST_NOT_APPEAR\|CI PRIVATE CANARY' apps/web/dist; then
            echo "ERROR: private content leaked into the public build"
            exit 1
          fi
          if [ -d apps/web/dist/_gallery ] && find apps/web/dist/_gallery -type f | grep -q .; then
            echo "ERROR: public build unexpectedly includes photo files."
            exit 1
          fi
          grep -q '今天想试试把碎碎念变成能长久保存' apps/web/dist/moments/index.html
          grep -q '哪些笔记链接到这里' apps/web/dist/notes/samples/knowledge-demo/index.html
          echo "Public build verified Diary Timeline, backlinks and privacy canary."
